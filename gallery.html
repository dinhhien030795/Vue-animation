<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Assets Gallery</title>
<style>body{font-family:system-ui,sans-serif;background:#1b1b2f;color:#eee;margin:0;padding:2rem}
h1{margin-top:0}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1rem}
figure{margin:0;background:#262645;border-radius:8px;padding:.75rem;text-align:center}
img{width:96px;height:96px;image-rendering:pixelated}figcaption{display:grid;font-size:.85rem}small{opacity:.6}</style></head>
<body><h1>Game Assets (10)</h1><main>
<figure><img src="assets/sprites/heart.svg" alt="heart"><figcaption>heart<small>sprites</small></figcaption></figure>
<figure><img src="assets/sprites/coin.svg" alt="coin"><figcaption>coin<small>sprites</small></figcaption></figure>
<figure><img src="assets/sprites/gem.svg" alt="gem"><figcaption>gem<small>sprites</small></figcaption></figure>
<figure><img src="assets/sprites/key.svg" alt="key"><figcaption>key<small>sprites</small></figcaption></figure>
<figure><img src="assets/sprites/sword.svg" alt="sword"><figcaption>sword<small>sprites</small></figcaption></figure>
<figure><img src="assets/sprites/potion.svg" alt="potion"><figcaption>potion<small>sprites</small></figcaption></figure>
<figure><img src="assets/sprites/slime.svg" alt="slime"><figcaption>slime<small>sprites</small></figcaption></figure>
<figure><img src="assets/sprites/star.svg" alt="star"><figcaption>star<small>sprites</small></figcaption></figure>
<figure><img src="assets/tiles/grass.svg" alt="grass"><figcaption>grass<small>tiles</small></figcaption></figure>
<figure><img src="assets/tiles/brick.svg" alt="brick"><figcaption>brick<small>tiles</small></figcaption></figure>
</main></body></html>
